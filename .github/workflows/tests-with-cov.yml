name: Tests with coverage

on:
  push:
    branches:
      - main
      - aho4cj_lt_1.0.5
      - aho4cj_st_1.1.3
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: aho4cj-ci-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    name: Test Cangjie ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: 1.0.5 LTS
            image: zxilly/cangjie:1.0.5@sha256:3d0b792712da2c9ac15e6a601b640d5d9acf5b57a0be260935045094fc0fb541
          - name: 1.1.3 STS
            image: zxilly/cangjie:1.1.3@sha256:542a2a41f25831cf3e95e6e046559b4c3a49a89686c4d191daa78d06dbd2ae1c
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Run tests
        env:
          CANGJIE_IMAGE: ${{ matrix.image }}
        run: |
          docker run --rm \
            --volume "$GITHUB_WORKSPACE:/workspace" \
            --workdir /workspace \
            "$CANGJIE_IMAGE" \
            cjpm test --target-dir target-test

  build:
    if: github.ref == 'refs/heads/main'
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Run Rust and Cangjie benchmarks
        run: |
          mkdir -p benchmark-results
          docker run --rm \
            --volume "$GITHUB_WORKSPACE:/workspace" \
            --workdir /workspace/benchmark/rust \
            rust:1.89-bookworm@sha256:948f9b08a66e7fe01b03a98ef1c7568292e07ec2e4fe90d88c07bb14563c84ff \
            bash -euo pipefail -c '
              CARGO_TARGET_DIR=/tmp/aho-rust-benchmark \
                cargo run --release --locked > /workspace/benchmark-results/rust.csv
            '
          docker run --rm \
            --volume "$GITHUB_WORKSPACE:/workspace" \
            --workdir /workspace/benchmark/cangjie \
            zxilly/cangjie:1.1.3@sha256:542a2a41f25831cf3e95e6e046559b4c3a49a89686c4d191daa78d06dbd2ae1c \
            bash -euo pipefail -c '
              cjpm build --target-dir /tmp/aho-cangjie-benchmark
              /tmp/aho-cangjie-benchmark/release/bin/main \
                > /workspace/benchmark-results/cangjie.csv
            '
          python3 benchmark/report.py \
            benchmark-results/rust.csv \
            benchmark-results/cangjie.csv \
            pages-site/benchmark \
            "$GITHUB_SHA"

      - name: Generate coverage report
        run: |
          docker run --rm \
            --volume "$GITHUB_WORKSPACE:/workspace" \
            --workdir /workspace \
            zxilly/cangjie:1.1.3@sha256:542a2a41f25831cf3e95e6e046559b4c3a49a89686c4d191daa78d06dbd2ae1c \
            bash -euo pipefail -c '
              cjpm test --coverage --target-dir target-coverage
              cjcov \
                --root=. \
                --source=src \
                --exclude=src/aho_corasick_test.cj \
                --html-details \
                --output=pages-site/coverage
              rm \
                pages-site/coverage/cjcov_logs/cjcov.log \
                pages-site/coverage/cjcov_logs/gcov_parse.log
              rmdir pages-site/coverage/cjcov_logs
            '
          cp benchmark/pages-index.html pages-site/index.html
          touch pages-site/.nojekyll

      - name: Configure Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Upload coverage report
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: pages-site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
